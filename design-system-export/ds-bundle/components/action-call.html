<!-- @dsCard group="Components" name="ActionCall — button" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionCall — button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --background: #1a1a1a; --text-primary: #f0ede6; --text-secondary: #d6cbb5;
      --text-inverted: #1a1a1a; --accent: #38eeb4; --accent-glow: rgba(56,238,180,0.15);
      --radius-pill: 999px; --spacing-unit: 8px;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--background);
      color: var(--text-primary); padding: 40px; min-height: 100vh;
      display: flex; flex-direction: column; gap: 32px;
    }
    .eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); }
    .row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .caption { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; color: var(--text-secondary); width: 100%; }

    .button-primary {
      display: inline-flex; align-items: center; gap: var(--spacing-unit);
      font-family: inherit; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; padding: 12px 28px; border-radius: var(--radius-pill);
      border: 2px solid var(--accent); background: var(--accent); color: var(--text-inverted);
      cursor: pointer; transition: background 300ms cubic-bezier(0.16,1,0.3,1), color 300ms cubic-bezier(0.16,1,0.3,1);
    }
    .button-primary:hover { background: transparent; color: var(--accent); }
    .button-ghost { background: transparent; color: var(--accent); border-color: var(--accent); }
    .button-ghost:hover { background: var(--accent-glow); }
    .arrow { font-size: 0.9em; }
  </style>
</head>
<body>
  <span class="eyebrow">ActionCall<span style="color:var(--accent)">_</span></span>
  <div class="row">
    <span class="caption">Primary — default / hover</span>
    <button class="button-primary">Grab my Resume <span class="arrow">&#8599;</span></button>
  </div>
  <div class="row">
    <span class="caption">Ghost variant</span>
    <button class="button-primary button-ghost">View Source <span class="arrow">&#8599;</span></button>
  </div>
</body>
</html>
