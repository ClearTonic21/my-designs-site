<!-- @dsCard group="Components" name="Navigation & glass section" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navigation &amp; glass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700;900&family=Lora:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1a1a1a; --text: #f0ede6; --accent: #38eeb4; --border: rgba(240,237,230,0.08); --overlay: rgba(26,26,26,0.8);
      --gold-fade: rgba(100,75,10,0.1); --gold-mid: rgba(201,162,39,0.7); --gold-peak: rgba(255,225,100,1);
      --teal-fade: rgba(56,238,180,0.05); --teal-mid: rgba(56,238,180,0.7); --teal-peak: rgba(56,238,180,1);
      --p: 'DM Sans', sans-serif; --b: 'Lora', serif;
    }
    * { box-sizing: border-box; margin: 0; }
    body { background: linear-gradient(120deg, #1a1a1a, #232323); color: var(--text); font-family: var(--p); padding: 40px; display: flex; flex-direction: column; gap: 28px; }
    .nav-bar { display: flex; align-items: center; gap: 32px; padding: 16px 24px; border-radius: 8px; background: var(--overlay); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border); }
    .brand { font-weight: 900; letter-spacing: -0.01em; }
    .links { display: flex; gap: 24px; margin-left: auto; }
    .link { position: relative; font-weight: 600; font-size: 0.9rem; text-decoration: none; color: var(--text); cursor: pointer; }
    .link::after { content: ''; position: absolute; left: 0; bottom: -2px; width: 100%; height: 1px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 300ms cubic-bezier(0.16,1,0.3,1); }
    .link:hover { color: var(--accent); }
    .link:hover::after { transform: scaleX(1); }
    .glass { position: relative; padding: 40px 32px; background: var(--overlay); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 2px solid transparent; border-bottom: 2px solid transparent; border-image: linear-gradient(90deg, var(--gold-fade), var(--gold-mid), var(--gold-peak), var(--gold-mid), var(--gold-fade)) 1; transition: border-image 300ms cubic-bezier(0.16,1,0.3,1); }
    .glass:hover { border-image: linear-gradient(90deg, var(--teal-fade), var(--teal-mid), var(--teal-peak), var(--teal-mid), var(--teal-fade)) 1; }
    .eyebrow { font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #fff; }
    .body { font-family: var(--b); font-size: 1rem; line-height: 1.78; margin-top: 8px; }
    .accent { color: var(--accent); }
  </style>
</head>
<body>
  <nav class="nav-bar">
    <span class="brand">CT<span class="accent">_</span></span>
    <div class="links">
      <a class="link" href="#">About_</a><a class="link" href="#">Experience_</a><a class="link" href="#">Projects_</a><a class="link" href="#">Contact_</a>
    </div>
  </nav>
  <div class="glass">
    <span class="eyebrow">Frosted island<span class="accent">_</span></span>
    <p class="body">Glass sections stay dark frosted islands over any theme, with gold borders that brighten to teal on hover or scroll-into-view.</p>
  </div>
</body>
</html>
