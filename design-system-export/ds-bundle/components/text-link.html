<!-- @dsCard group="Components" name="Text links" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #1a1a1a; --text: #f0ede6; --text2: #d6cbb5; --accent: #38eeb4; --p: 'DM Sans', sans-serif; }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--p); padding: 48px; display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }
    .caption { font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text2); }
    .text-link {
      position: relative; display: inline-flex; align-items: center; gap: 6px;
      font-weight: 600; font-size: 1rem; text-decoration: none; color: var(--text); cursor: pointer;
      transition: color 300ms cubic-bezier(0.16,1,0.3,1);
    }
    .text-link::after {
      content: ''; position: absolute; left: 0; bottom: -2px; width: 100%; height: 1px;
      background: var(--accent); transform: scaleX(0); transform-origin: left;
      transition: transform 300ms cubic-bezier(0.16,1,0.3,1);
    }
    .text-link:hover { color: var(--accent); }
    .text-link:hover::after { transform: scaleX(1); }
    svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <span class="caption">Hover to see the underline wipe</span>
  <a class="text-link" href="#">Email
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
  </a>
  <a class="text-link" href="#">LinkedIn</a>
  <a class="text-link" href="#">GitHub
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10"/></svg>
  </a>
</body>
</html>
