<!-- @dsCard group="Foundations" name="Spacing & radius" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spacing &amp; radius</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #1a1a1a; --surface: #232323; --text: #f0ede6; --text2: #d6cbb5; --accent: #38eeb4; --border: rgba(240,237,230,0.08); --p: 'DM Sans', sans-serif; }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--p); padding: 40px; display: flex; flex-direction: column; gap: 32px; }
    .eyebrow { font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #fff; margin-bottom: 16px; }
    .accent { color: var(--accent); }
    .bar-row { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
    .bar-row .num { width: 56px; font-size: 0.72rem; font-weight: 600; color: var(--text2); }
    .bar { height: 16px; background: var(--accent); border-radius: 2px; }
    .radii { display: flex; gap: 20px; flex-wrap: wrap; }
    .radius { width: 88px; height: 88px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: flex-end; justify-content: center; padding: 8px; font-size: 0.66rem; font-weight: 600; color: var(--text2); }
  </style>
</head>
<body>
  <section>
    <div class="eyebrow">Spacing — 8px grid<span class="accent">_</span></div>
    <div class="bar-row"><span class="num">8</span><div class="bar" style="width:8px"></div></div>
    <div class="bar-row"><span class="num">16</span><div class="bar" style="width:16px"></div></div>
    <div class="bar-row"><span class="num">24</span><div class="bar" style="width:24px"></div></div>
    <div class="bar-row"><span class="num">32</span><div class="bar" style="width:32px"></div></div>
    <div class="bar-row"><span class="num">48</span><div class="bar" style="width:48px"></div></div>
    <div class="bar-row"><span class="num">64</span><div class="bar" style="width:64px"></div></div>
    <div class="bar-row"><span class="num">96</span><div class="bar" style="width:96px"></div></div>
    <div class="bar-row"><span class="num">128</span><div class="bar" style="width:128px"></div></div>
  </section>
  <section>
    <div class="eyebrow">Radius<span class="accent">_</span></div>
    <div class="radii">
      <div class="radius" style="border-radius:4px">4 · sm</div>
      <div class="radius" style="border-radius:8px">8 · md</div>
      <div class="radius" style="border-radius:16px">16 · lg</div>
      <div class="radius" style="border-radius:999px">pill</div>
    </div>
  </section>
</body>
</html>
